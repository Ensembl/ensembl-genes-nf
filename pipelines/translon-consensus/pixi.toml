[project]
name = "translon-consensus"
version = "0.1.0"
description = "Translon consensus pipeline testing environment"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = ">=3.10"
pandas = ">=2.0"
jinja2 = ">=3.0"
matplotlib = ">=3.7"
seaborn = ">=0.12"
jupyter = ">=1.0"

[tasks]
test-report = "python bin/generate_html_report.py -i ../../test_consensus_results -o ../../test_consensus_results/report.html -u 'https://genome-euro.ucsc.edu/cgi-bin/hgTracks?db=hg38'"
notebook = "jupyter notebook bin/consensus_analysis.ipynb"
