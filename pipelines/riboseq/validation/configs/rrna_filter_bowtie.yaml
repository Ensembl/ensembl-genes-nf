# =============================================================================
# rRNA FILTERING: BOWTIE
# =============================================================================
# Enables rRNA filtering using Bowtie alignment.
# Requires rrna_index to be set in the run command.
#
# Key difference: run_rrna_filter: true
# =============================================================================

# -----------------------------------------------------------------------------
# RPF Extraction
# -----------------------------------------------------------------------------
rpf_extraction_method: 'getrpf'
getrpf_max_reads: 5000

# -----------------------------------------------------------------------------
# rRNA Filtering - MODIFIED
# -----------------------------------------------------------------------------
run_rrna_filter: true                   # Enable rRNA filtering
rrna_filter_method: 'bowtie'
bowtie_rrna_mismatches: 2               # Allow 2 mismatches
bowtie_rrna_k: 1                        # Report first alignment only

# -----------------------------------------------------------------------------
# Alignment (STAR) - same as baseline
# -----------------------------------------------------------------------------
mismatches: 3
alignment_type: 'EndToEnd'
allow_introns: true
max_multimappers: 10
min_mapq: 0
trim_front: 0

# -----------------------------------------------------------------------------
# Read Length Filtering
# -----------------------------------------------------------------------------
filter_by_length: false

# -----------------------------------------------------------------------------
# RiboMetric
# -----------------------------------------------------------------------------
ribometric_offset_method: 'tripsviz'
ribometric_sample_size: 10000000

# -----------------------------------------------------------------------------
# RiboWaltz
# -----------------------------------------------------------------------------
ribowaltz_exclude_start: 0
ribowaltz_exclude_stop: 0
ribowaltz_flanking: 6
ribowaltz_extremity: 'auto'
ribowaltz_confidence_level: 99
ribowaltz_utr5_length: 25
ribowaltz_cds_length: 40
ribowaltz_utr3_length: 25

# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
normalize_coverage: false
