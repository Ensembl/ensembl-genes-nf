rule_set_name: default
version: 1
sample_rules:
  - name: min_unique_mapped_reads
    metric: star.unique_mapped_reads
    scope: sample
    op: ">="
    threshold: 500000
    severity: fail
    include_if_missing: false
  - name: min_information_content
    metric: ribometric.information_content
    scope: sample
    op: ">="
    threshold: 1.5
    severity: fail
    include_if_missing: false
length_rules:
  - name: min_reads_per_length
    metric: ribometric.reads_at_length
    scope: length
    op: ">="
    threshold: 5000
    severity: fail
    include_if_missing: false
  - name: min_frame0_fraction
    metric: ribometric.frame0_frac
    scope: length
    op: ">="
    threshold: 0.65
    severity: fail
    include_if_missing: false
selection:
  selected_for_translon: true
  selected_for_trackhub: true
