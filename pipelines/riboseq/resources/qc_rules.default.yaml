rule_set_name: default
version: 1
sample_rules:
  - name: min_unique_mapped_reads
    metric: star.unique_mapped_reads
    scope: sample
    op: ">="
    threshold: 100000
    severity: fail
    include_if_missing: false
  - name: min_recommended_read_lengths
    metric: ribometric.n_recommended_read_lengths
    scope: sample
    op: ">="
    threshold: 1
    severity: fail
    include_if_missing: false
  - name: min_recommended_read_proportion
    metric: ribometric.recommended_read_proportion
    scope: sample
    op: ">="
    # RiboMetric recommends lengths with periodicity >= 0.5 and read
    # proportion >= 0.05. Requiring 0.3 keeps samples where a substantial
    # fraction remains usable without rejecting mixed public libraries by a
    # single hard periodicity score.
    threshold: 0.3
    severity: fail
    include_if_missing: false
length_rules:
  - name: min_reads_per_length
    metric: ribometric.reads_at_length
    scope: length
    op: ">="
    threshold: 5000
    severity: fail
    include_if_missing: false
  - name: ribometric_recommended_length
    metric: ribometric.recommended_length
    scope: length
    op: ">="
    threshold: 1
    severity: fail
    include_if_missing: false
selection:
  selected_for_translon: true
  selected_for_trackhub: true
