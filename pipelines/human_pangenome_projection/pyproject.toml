[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpp"
version = "0.1.0"
description = "Human pangenome annotation projection pipeline (modular package + Nextflow orchestration)"
requires-python = ">=3.9"
dependencies = [
    "pysam>=0.22.0",
    "biopython>=1.82",
    "edlib>=1.3.9",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0"]

[project.scripts]
hpp = "hpp.cli:cli"

[tool.setuptools]
packages = ["hpp", "hpp.stages", "hpp.validation"]
