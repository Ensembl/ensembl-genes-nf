name: Deploy Statistics Pipeline Documentation

# This workflow deploys documentation specifically for the pipelines/statistics pipeline
# It can be extended to support multiple pipelines in the future

on:
  push:
    branches:
      - feature/collection_tmp  # Deploy from this branch during development
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yaml'
  
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yaml'
  
  # Allow manual triggering
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write


# Allow only one concurrent deployment
concurrency:
  group: "gh-pages"
  cancel-in-progress: false

jobs:
  # Build job
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
      
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install project docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install zensical mkdocs-material mkdocs-gen-files \
          mkdocstrings[python] mkdocs-literate-nav mkdocs-section-index \
          mkdocs-coverage mkdocs-minify-plugin mkdocs-git-revision-date-localized-plugin
      
      - name: Verify MkDocs configuration
        run: |
          echo "Verifying MkDocs configuration for statistics pipeline..."
          zensical build --config-file mkdocs.yml --strict
      
      - name: Build MkDocs site
        run: |
          echo "Building statistics pipeline documentation..."
          zensical build --config-file mkdocs.yml --output site_statistics
      
      # Deploy ONLY on push or manual trigger
      - name: Deploy to GitHub Pages (gh-pages branch)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site_statistics
          publish_branch: gh-pages
          force_orphan: true
      # PR Preview Comment
      - name: Comment on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📚 Documentation Preview Built

              ✅ Statistics pipeline documentation built successfully!

              > This is a preview build. Documentation will be deployed when merged or pushed to the deployment branch.`
                          })