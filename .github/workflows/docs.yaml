name: Deploy Statistics Pipeline Documentation

# This workflow deploys documentation specifically for the pipelines/statistics pipeline
# It can be extended to support multiple pipelines in the future

on:
  push:
    branches:
      - feature/collection_tmp  # Deploy from this branch during development
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yaml'
  
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yaml'
  
  # Allow manual triggering
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
      
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install project docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material mkdocs-gen-files \
          mkdocstrings[python] mkdocs-literate-nav mkdocs-section-index \
          mkdocs-coverage mkdocs-minify-plugin mkdocs-git-revision-date-localized-plugin
      
      - name: Verify MkDocs configuration
        run: |
          echo "Verifying MkDocs configuration for statistics pipeline..."
          mkdocs build --config-file mkdocs.yml --strict --verbose
      
      - name: Build MkDocs site
        run: |
          echo "Building statistics pipeline documentation..."
          mkdocs build --config-file mkdocs.yml --site-dir site_statistics
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_statistics

  # Deploy job
  deploy:
    # Only deploy on push to main/feature branches (not on PRs)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v3

      - name: Deploy Statistics Pipeline Docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site_statistics
          # MkDocs build output directory
          # Optional: specify branch or folder
          # publish_branch: gh-pages
          # keep_files: true

      - name: Summary
        run: |
          echo "## 📚 Statistics Pipeline Documentation Deployed! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Documentation built successfully" >> $GITHUB_STEP_SUMMARY
          echo "🌐 Live at: https://${{ github.repository_owner }}.github.io/${{ github.repository }}/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Info" >> $GITHUB_STEP_SUMMARY
          echo "- Pipeline: Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # Preview job for pull requests
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## 📚 Documentation Preview Built\n\n✅ Statistics pipeline documentation built successfully!\n\n> **Note:** This is a preview build. Documentation will be deployed when merged to main.'
            })
