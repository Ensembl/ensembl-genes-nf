name: Documentation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Generate Parameter Reference
        run: python docs/scripts/render_schema_docs.py

      - name: Sphinx Build
        run: sphinx-build -W --keep-going -b html docs/source docs/build/html

      - name: Check for MkDocs Site
        id: mkdocs
        run: |
          if [ -f mkdocs.yml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install MkDocs Dependencies
        if: steps.mkdocs.outputs.found == 'true'
        run: |
          python -m pip install \
            zensical \
            mkdocs \
            mkdocs-material \
            mkdocs-gen-files \
            "mkdocstrings[python]" \
            mkdocs-literate-nav \
            mkdocs-section-index \
            mkdocs-coverage \
            mkdocs-minify-plugin \
            mkdocs-git-revision-date-localized-plugin

      - name: Build MkDocs Site
        if: steps.mkdocs.outputs.found == 'true'
        run: |
          zensical build --config-file mkdocs.yml --strict
          mkdir -p docs/build/html/statistics
          cp -R site_statistics/. docs/build/html/statistics/

      - name: Link Check
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        run: sphinx-build -b linkcheck docs/source docs/build/linkcheck

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
          force_orphan: true
