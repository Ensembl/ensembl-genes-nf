  <a href="https://www.ebi.ac.uk">EMBL-European Bioinformatics Institute</a>
docs_dir: docs
site_name: Ensembl Genes Nf Pipeline
site_description: Documentation for the Ensembl Genes Nf Pipeline
site_author: Ensembl Team
repo_url: https://github.com/Ensembl/ensembl-genes-nf
repo_name: Ensembl/ensembl-genes-nf
site_dir: site_ensembl_genes_nf


theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  font:
    code: IBM Plex Mono
    text: Lato
  icon:
    repo: fontawesome/brands/github
  logo: img/ebang.png

use_directory_urls: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true    

nav:
  - Statistics Pipeline:
    - Overview: pipelines/statistics/index.md
    - Parameters: pipelines/statistics/parameters.md
    - Input Format: pipelines/statistics/input.md
    - Workflows:
      - BUSCO: pipelines/statistics/workflows/busco.md
      - OMArk: pipelines/statistics/workflows/omark.md
      - Ensembl Stats: pipelines/statistics/workflows/ensembl-stats.md
      - Pepstats: pipelines/statistics/workflows/pepstats.md
    - Modules:
          - Overview: pipelines/statistics/modules/index.md  
    - Output: pipelines/statistics/output.md
    - Troubleshooting: pipelines/statistics/troubleshooting.md

